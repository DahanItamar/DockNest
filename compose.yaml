name: docknest
x-runtime: &runtime
  build: .
  image: docknest:local
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment:
    NODE_ENV: production
    PORT: 3000
    DATA_DIR: /data
    BACKUP_STORAGE: unconfigured
    MASTER_KEY_FILE: /run/secrets/master_key
    SETUP_TOKEN_FILE: /run/secrets/setup_token
    APP_ORIGIN: ${APP_ORIGIN:?Configure the HTTPS dashboard origin before starting Compose}
    SECURE_COOKIES: ${SECURE_COOKIES:-true}
  volumes: ["state:/data"]
  secrets: [master_key, setup_token]
services:
  api:
    <<: *runtime
    ports: ["127.0.0.1:${HOST_PORT:-3000}:3000"]
    # This list replaces the x-runtime anchor's volumes (a merge key does not combine lists): it must repeat every
    # anchor mount (tests/host-updater.test.js checks it).
    volumes:
      - state:/data
      # Host updater socket and status (docs/updater-threat-model.md D1): read-only and api only. Without the updater
      # the volume stays empty and DockNest shows the manual upgrade command.
      - {type: volume, source: updater, target: /run/docknest-updater, read_only: true, volume: {nocopy: true}}
  worker:
    <<: *runtime
    command: ["node", "src/worker.js"]
    # SIGTERM drains: no new jobs are claimed and the running job finishes before exit.
    # Jobs still running after this period are SIGKILLed and become recovery_required on next start.
    stop_grace_period: 5m
    depends_on: [api]
  proxy:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set the dashboard domain before enabling the HTTPS profile}
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        # While the API is down or restarting, Caddy serves the static page public/unavailable.html with a 503.
        printf '%s\n' "$$APP_DOMAIN {" "  reverse_proxy api:3000" "  handle_errors {" "    @down expression {http.error.status_code} in [502, 503, 504]" "    handle @down {" "      root * /srv" "      rewrite * /unavailable.html" "      header Cache-Control no-store" "      file_server {" "        status 503" "      }" "    }" "  }" "}" > /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    volumes: ["caddy_data:/data", "caddy_config:/config", "./public/unavailable.html:/srv/unavailable.html:ro"]
    depends_on: [api]
secrets:
  master_key:
    file: ./data/master.key
  setup_token:
    file: ./data/setup.token
volumes:
  state:
    name: docker-backup-manager_state
  caddy_data:
    name: docker-backup-manager_caddy_data
  caddy_config:
    name: docker-backup-manager_caddy_config
  updater:
    name: docknest_updater
