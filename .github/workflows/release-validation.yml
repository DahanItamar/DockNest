name: Release validation
# Upgrades a real v2.0.0 Docker Compose installation to a release, drains the worker, then downgrades and upgrades again with
# scripts/upgrade.sh, checking data, configuration and secrets at every step. See docs/release-validation.md.
# Run by hand only. With `candidate` (a full commit SHA on main) it validates that commit privately before it is tagged:
# the image is built inside this runner from source, nothing is pushed, and the version tag exists only in the throwaway
# clone. release.yml refuses a final vX.Y.Z tag unless a successful candidate run from main exists for exactly that commit.
# With `target` it re-validates an existing final tag (default: the newest one).
run-name: ${{ inputs.candidate && format('Release validation candidate {0}', inputs.candidate) || format('Release validation {0}', inputs.target || 'newest final tag') }}
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Full 40-character commit SHA on main to validate before tagging it (run from main). Leave empty to use target.'
        required: false
        default: ''
      target:
        description: 'Existing final release tag to re-validate, for example v2.1.0. Empty means the newest final vX.Y.Z tag.'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: release-validation-${{ inputs.candidate || inputs.target || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # every release tag and origin/main must be present: the validation clones this checkout
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # A candidate must be a full SHA that is on main, validated by the workflow file on main: release.yml trusts only
      # successful runs dispatched from main whose run name carries that SHA.
      - name: Resolve what to validate
        id: target
        env:
          CANDIDATE: ${{ inputs.candidate }}
          INPUT: ${{ inputs.target }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ -n "$CANDIDATE" ]; then
            [ -z "$INPUT" ] || { echo "::error::Set candidate or target, not both"; exit 1; }
            printf '%s\n' "$CANDIDATE" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::candidate must be a full 40-character lowercase commit SHA"; exit 1; }
            [ "$DISPATCH_REF" = refs/heads/main ] || { echo "::error::Run candidate validation from main (dispatched from $DISPATCH_REF)"; exit 1; }
            git cat-file -e "$CANDIDATE^{commit}" 2>/dev/null || { echo "::error::Commit $CANDIDATE is not in this repository"; exit 1; }
            git merge-base --is-ancestor "$CANDIDATE" origin/main || { echo "::error::$CANDIDATE is not on main"; exit 1; }
            version=$(git show "$CANDIDATE:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
            printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::package.json at $CANDIDATE is $version; a candidate carries the final X.Y.Z it will be tagged as"; exit 1; }
            echo "mode=candidate" >> "$GITHUB_OUTPUT"; echo "value=$CANDIDATE" >> "$GITHUB_OUTPUT"
            echo "label=v$version-candidate-${CANDIDATE:0:12}" >> "$GITHUB_OUTPUT"
          else
            target=$INPUT
            [ -n "$target" ] || target=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n 1p)
            printf '%s\n' "$target" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::Not a release tag: $target"; exit 1; }
            echo "mode=target" >> "$GITHUB_OUTPUT"; echo "value=$target" >> "$GITHUB_OUTPUT"
            echo "label=$target" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate v2.0.0 to ${{ steps.target.outputs.label }} on real Docker
        env:
          MODE: ${{ steps.target.outputs.mode }}
          VALUE: ${{ steps.target.outputs.value }}
        run: node scripts/release-validation.js "--$MODE" "$VALUE" --out "$RUNNER_TEMP/release-validation"
      - name: Job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/release-validation/summary.md" ]; then cat "$RUNNER_TEMP/release-validation/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else echo '## Release validation: no evidence was produced (the job stopped before the driver ran).' >> "$GITHUB_STEP_SUMMARY"; fi
      # The driver redacts every credential it generated or read and blanks any evidence file where one still appears.
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-validation-${{ steps.target.outputs.label || 'unresolved' }}
          path: ${{ runner.temp }}/release-validation
          if-no-files-found: ignore
          retention-days: 30
