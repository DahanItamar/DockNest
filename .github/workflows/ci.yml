name: Verify
# Branch pushes and pull requests only: a tag push would start a second Verify run on the tagged commit, and the
# release gate must find the run that main's push already finished. Every required check still reports on PRs and main.
# One run per change: pushes to main (the release gate reads that run) and pull requests. Feature-branch pushes
# without a PR do not run. A newer push to a pull request cancels its older run. The slow Linux integration job runs
# on main and on pull requests that are ready for review; on drafts it reports skipped, which saves about 15 minutes
# per push while work is in progress. Marking a PR ready runs it in full before anything can merge.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node scripts/audit-repository.js
      - name: Scan Git history for secrets
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts="--all" --redact=100 --max-archive-depth=2 --no-banner
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0   # tests/migrations.test.js and tests/alert-connections-compat.test.js run released code from its tags (v2.1.0, v2.9.0)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: docker build -t docknest:ci .
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: |
          node src/server.js > /tmp/docknest-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/healthz > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
          npm run test:theme
          npm run test:design
          npm run test:self-backup
          npm run test:storage
          npm run test:storage-report
          npm run test:mobile
          npm run test:reports
          npm run test:status-pages
          npm run test:map
          npm run test:connections
          npm run test:layout
        env:
          TEST_BROWSER_CHANNEL: chromium
          TEST_BASE_URL: http://127.0.0.1:3000
  linux-integration:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # the downgrade check reads the 2.11.1 helper from its release tag
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-integration-results
          path: data/qa/linux-integration.json
  upgrade:
    # Starts this commit on metadata written by every final release since minUpgradeFrom, then checks the downgrade
    # guard and snapshot rollback. Not a required check unless branch protection adds it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Upgrade from released versions
        run: |
          minimum=$(node -p "require('./package.json').docknest.minUpgradeFrom")
          tags=$(git tag -l 'v*' --sort=v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | awk -v min="$minimum" 'BEGIN{split(min,m,".")} {split(substr($0,2),v,"."); if (v[1]>m[1]||(v[1]==m[1]&&(v[2]>m[2]||(v[2]==m[2]&&v[3]>=m[3])))) print}')
          test -n "$tags"
          for tag in $tags; do echo "::group::$tag"; npm run --silent test:upgrade -- "$tag"; echo '::endgroup::'; done
      - name: Upgrade script against a Compose test double
        run: node --test tests/upgrade-script.test.js
  controlled-beta-gate:
    needs: [privacy, check, browser, linux-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-integration-results
          path: data/qa
      - run: node scripts/aggregate-gate.js data/qa/linux-integration.json
        env:
          NODE_CHECKS: ${{ needs.check.result }}
          PRIVACY_CHECKS: ${{ needs.privacy.result }}
          BROWSER_CHECKS: ${{ needs.browser.result }}
      - run: node scripts/beta-gate.js data/qa/controlled-beta.json "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: controlled-beta-evidence
          path: data/qa/controlled-beta.json

  # Real S3 semantics (multipart, ranges, conditional copy, Object Lock) against a
  # MinIO-compatible server. A required check now that S3 is no longer beta,
  # separate from controlled-beta-gate. Upstream MinIO images and binaries are
  # archived, so this pins the maintained Pigsty fork by digest.
  s3-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      S3_SERVER_IMAGE: pgsty/minio:RELEASE.2026-06-18T00-00-00Z@sha256:dacff8306a6e0a734518533992dbdcca26bc1ca47f77cf47cb9945725f92b29b
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Start S3 server with throwaway credentials
        run: |
          key="ci$(openssl rand -hex 10)"
          secret="$(openssl rand -hex 24)"
          echo "::add-mask::$key"
          echo "::add-mask::$secret"
          echo "S3_ACCESS_KEY=$key" >> "$GITHUB_ENV"
          echo "S3_SECRET_KEY=$secret" >> "$GITHUB_ENV"
          docker run -d --name s3 -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER="$key" -e MINIO_ROOT_PASSWORD="$secret" "$S3_SERVER_IMAGE" server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs s3 | tail -n 20
          exit 1
      - run: npm run test:s3
        env:
          S3_ENDPOINT: http://127.0.0.1:9000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: s3-integration-results
          path: data/qa/s3-integration.json
          if-no-files-found: ignore
