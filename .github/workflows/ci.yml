name: Verify
# Branch pushes and pull requests only: a tag push would start a second Verify run on the tagged commit, and the
# release gate must find the run that main's push already finished. Every required check still reports on PRs and main.
# One run per change: pushes to main (the release gate reads that run) and pull requests. Feature-branch pushes
# without a PR do not run. A newer push to a pull request cancels its older run. The slow Linux integration job runs
# on main and on pull requests that are ready for review; on drafts it reports skipped, which saves about 15 minutes
# per push while work is in progress. Marking a PR ready runs it in full before anything can merge.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Manual run of the Linux integration job only, optionally one scenario: `only=self-heal` (scripts/integration-linux.js
  # INTEGRATION_ONLY). Test-only and never a merge signal: every other job and the beta gate are skipped on it, so the
  # checks that pull requests and main require are unchanged.
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this Linux integration scenario (self-heal or launch), or leave empty for the full suite'
        type: string
        required: false
        default: ''
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  privacy:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node scripts/audit-repository.js
      - name: Scan Git history for secrets
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts="--all" --redact=100 --max-archive-depth=2 --no-banner
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0   # tests/migrations.test.js and tests/alert-connections-compat.test.js run released code from its tags (v2.1.0, v2.9.0)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: docker build -t docknest:ci .
  # The helper runtime image for NAS servers without Python (docs/nas-servers.md): built once, loaded fresh, proven (labels,
  # linux/amd64, Python 3.9+, Docker CLI, tar, no network interface), then pinned into a DockNest image build whose
  # shipped tar must match the pin. No secrets are used and nothing is pushed.
  helper-runtime:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - run: bash scripts/build-helper-runtime.sh --pin
      - name: The DockNest image carries the tar that was pinned
        run: |
          set -euo pipefail
          pinned=$(node --input-type=module -e "import { HELPER_RUNTIME_TAR_SHA256 as s, HELPER_RUNTIME_IMAGE_ID as i, HELPER_RUNTIME_LAYERS as L, HELPER_RUNTIME_MANIFEST_DIGEST as M, isLayerList, isTarSha256, isPinnedImageId } from './shared/helper-runtime.js'; if (!isTarSha256(s) || !isPinnedImageId(i) || !isLayerList(L) || !isPinnedImageId(M)) process.exit(1); console.log(s)")
          docker build -t docknest:ci-runtime .
          shipped=$(docker run --rm --entrypoint sha256sum docknest:ci-runtime /app/helper-runtime.tar | cut -d' ' -f1)
          [ "$shipped" = "$pinned" ] || { echo "::error::the shipped tar $shipped differs from the pin $pinned"; exit 1; }
  browser:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: |
          node src/server.js > /tmp/docknest-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/healthz > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
          npm run test:theme
          npm run test:design
          npm run test:self-backup
          npm run test:storage
          npm run test:storage-report
          npm run test:cleanup
          npm run test:mobile
          npm run test:reports
          npm run test:status-pages
          npm run test:map
          npm run test:domains
          npm run test:hardening
          npm run test:keys-safe
          npm run test:restore-check
          npm run test:backup-coverage
          npm run test:connections
          npm run test:layout
          npm run test:jobs-sqlite
          npm run test:login-typing
          npm run test:recovery-guide
          npm run test:dumps
          npm run test:restore-tests
          npm run test:auth
          npm run test:self-heal
          npm run test:safe-edit
        env:
          TEST_BROWSER_CHANNEL: chromium
          TEST_BASE_URL: http://127.0.0.1:3000
  linux-integration:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    # Safe Edit scenarios (scripts/integration-safe-edit.js) add about 20 minutes of real health windows.
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # the downgrade check reads the 2.11.1 helper from its release tag
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The Recovery Guide scenario (scripts/integration-runbook.js) checks its PDF with qpdf and pdftotext.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf poppler-utils
      # The maintenance page embeds a font from dist/ (src/engine.js maintenanceHtml); the launch scenario sets it up.
      - run: npm run build
      - run: npm run test:integration
        env:
          INTEGRATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-integration-results
          path: data/qa/linux-integration.json
  # MongoDB, once per tested major (shared/database-engines.js testedVersions), on the same ready-only rule as the
  # Linux suite. Each job runs only the MongoDB scenario on fresh nested hosts; the release gate needs all three.
  mongo-integration:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mongo: ['6.0', '7.0', '8.0']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration
        env:
          INTEGRATION_ONLY: mongo
          MONGO_IMAGE: mongo:${{ matrix.mongo }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mongo-integration-${{ matrix.mongo }}
          path: data/qa/linux-integration.json
  upgrade:
    if: github.event_name != 'workflow_dispatch'
    # Starts this commit on metadata written by every final release since minUpgradeFrom, then checks the downgrade
    # guard and snapshot rollback. Not a required check unless branch protection adds it.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Upgrade from released versions
        run: |
          minimum=$(node -p "require('./package.json').docknest.minUpgradeFrom")
          tags=$(git tag -l 'v*' --sort=v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | awk -v min="$minimum" 'BEGIN{split(min,m,".")} {split(substr($0,2),v,"."); if (v[1]>m[1]||(v[1]==m[1]&&(v[2]>m[2]||(v[2]==m[2]&&v[3]>=m[3])))) print}')
          test -n "$tags"
          for tag in $tags; do echo "::group::$tag"; npm run --silent test:upgrade -- "$tag"; echo '::endgroup::'; done
      - name: Upgrade script against a Compose test double
        run: node --test tests/upgrade-script.test.js
  # A required check that a failed need would otherwise turn into "skipped", which branch protection counts as
  # passing. always() makes it run anyway and its first step fails unless every need succeeded. On drafts the whole
  # integration chain is skipped by design, so this gate stays skipped there exactly as before.
  controlled-beta-gate:
    if: always() && github.event_name != 'workflow_dispatch' && (github.event_name == 'push' || github.event.pull_request.draft == false)
    needs: [privacy, check, helper-runtime, browser, linux-integration, mongo-integration]
    runs-on: ubuntu-26.04
    steps:
      - name: Every needed job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e "const failed=Object.entries(JSON.parse(process.env.NEEDS)).filter(([,job])=>job.result!=='success');if(failed.length){console.error('Needed jobs did not pass: '+failed.map(([name,job])=>name+'='+job.result).join(', '));process.exit(1);}"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-integration-results
          path: data/qa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mongo-integration-*
          path: data/qa/mongo
      - run: node scripts/aggregate-gate.js data/qa/linux-integration.json data/qa/mongo
        env:
          NODE_CHECKS: ${{ needs.check.result }}
          PRIVACY_CHECKS: ${{ needs.privacy.result }}
          BROWSER_CHECKS: ${{ needs.browser.result }}
      - run: node scripts/beta-gate.js data/qa/controlled-beta.json "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: controlled-beta-evidence
          path: data/qa/controlled-beta.json

  # Real S3 semantics (multipart, ranges, conditional copy, Object Lock) against a
  # MinIO-compatible server. A required check now that S3 is no longer beta,
  # separate from controlled-beta-gate. Upstream MinIO images and binaries are
  # archived, so this pins the maintained Pigsty fork by digest.
  s3-integration:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      S3_SERVER_IMAGE: pgsty/minio:RELEASE.2026-06-18T00-00-00Z@sha256:dacff8306a6e0a734518533992dbdcca26bc1ca47f77cf47cb9945725f92b29b
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Start S3 server with throwaway credentials
        run: |
          key="ci$(openssl rand -hex 10)"
          secret="$(openssl rand -hex 24)"
          echo "::add-mask::$key"
          echo "::add-mask::$secret"
          echo "S3_ACCESS_KEY=$key" >> "$GITHUB_ENV"
          echo "S3_SECRET_KEY=$secret" >> "$GITHUB_ENV"
          docker run -d --name s3 -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER="$key" -e MINIO_ROOT_PASSWORD="$secret" "$S3_SERVER_IMAGE" server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs s3 | tail -n 20
          exit 1
      - run: npm run test:s3
        env:
          S3_ENDPOINT: http://127.0.0.1:9000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: s3-integration-results
          path: data/qa/s3-integration.json
          if-no-files-found: ignore
