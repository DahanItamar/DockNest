name: Release
# Publishes ghcr.io/<owner>/docknest for a final vX.Y.Z tag, signs it keylessly and attaches docknest-release.json with
# its keyless cosign bundle (docknest-release.json.sigstore.json). The release is created as a draft and published only
# after the image signature and the uploaded manifest bundle verify with the same pinned cosign (threat model F6).
# The image is pushed only as sha-<commit> and signed by digest; the X.Y.Z, X.Y, X and latest tags are added to that same
# digest only after the draft's downloaded assets verify, so a failed run never moves a public version tag. There are no public release candidates: a tag with a pre-release suffix
# (vX.Y.Z-rc.N) fails before anything is built, so it never creates a GitHub Release or an image tag. A candidate is
# validated privately by release-validation.yml (candidate input) on its main commit before the final tag is pushed.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Fail closed: nothing is built, pushed or signed unless this read-only job proves that the tag is a final vX.Y.Z, its
  # commit is on main, the Verify workflow (privacy, check, browser, linux-integration, upgrade, gate) finished
  # successfully for exactly that commit, and the Release validation workflow, dispatched from main with that commit as
  # its candidate, succeeded. The write permissions exist only in the publish job, which needs this one.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read    # check out the tagged commit and main's history
      actions: read     # look up the Verify and Release validation runs for the tagged commit
    steps:
      - name: Refuse anything but a final vX.Y.Z tag
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ $REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::$REF_NAME is not a final vX.Y.Z tag. Release candidates are not published; validate the main commit with the Release validation workflow (candidate input) and tag vX.Y.Z instead."; exit 1; }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # all branches and tags: origin/main must be present for the ancestry checks
          persist-credentials: false
      # GitHub's filtered workflow-runs queries (branch, event, status, head_sha) lag and flip for minutes, so both checks
      # list recent runs without filters (up to 3 pages of 100), filter them in jq, and retry 6 times, 20 s apart.
      - name: Require tag on main with a green Verify run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git rev-parse -q --verify refs/remotes/origin/main > /dev/null || { echo "::error::origin/main was not fetched"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }
          filter="[.workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\" and .name == \"Verify\" and .status == \"completed\" and .conclusion == \"success\" and .event == \"push\" and .head_repository.full_name == \"$GITHUB_REPOSITORY\")] | length"
          for attempt in 1 2 3 4 5 6; do
            passed=0
            for page in 1 2 3; do
              n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?per_page=100&page=$page" --jq "$filter") || n=0
              passed=$((passed + ${n:-0}))
            done
            [ "$passed" -ge 1 ] && exit 0
            [ "$attempt" = 6 ] || { echo "No successful Verify run listed for $GITHUB_SHA yet (attempt $attempt of 6); retrying in 20 s"; sleep 20; }
          done
          echo "::error::No successful Verify run for $GITHUB_SHA; wait for CI on main to pass before tagging"; exit 1
      # The run name carries the candidate SHA (run-name in release-validation.yml). Only successful runs dispatched from
      # main in this repository count, and the commit each ran from must be on main, so the workflow file that did the
      # validation is the protected one on main (a tag named "main" would also report head_branch main).
      - name: Require a successful release validation of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          filter=".workflow_runs[] | select(.display_title == \"Release validation candidate $GITHUB_SHA\" and .status == \"completed\" and .conclusion == \"success\" and .event == \"workflow_dispatch\" and .head_branch == \"main\" and .head_repository.full_name == \"$GITHUB_REPOSITORY\") | .head_sha"
          for attempt in 1 2 3 4 5 6; do
            runs=''
            for page in 1 2 3; do
              runs="$runs $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-validation.yml/runs?per_page=100&page=$page" --jq "$filter" || true)"
            done
            for run in $runs; do git merge-base --is-ancestor "$run" origin/main 2>/dev/null && exit 0; done
            [ "$attempt" = 6 ] || { echo "No successful Release validation run listed for $GITHUB_SHA yet (attempt $attempt of 6); retrying in 20 s"; sleep 20; }
          done
          echo "::error::No successful Release validation run for candidate $GITHUB_SHA; run it from main with that commit as the candidate before tagging"; exit 1
  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # create the GitHub Release and upload its manifest
      packages: write   # push to ghcr.io with GITHUB_TOKEN
      id-token: write   # cosign keyless signing through GitHub OIDC
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Resolve release
        id: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Fails before anything is built when the notes front matter or the updater file list is invalid.
          node scripts/release-manifest.js --version "$version" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docknest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ steps.release.outputs.image }}
          # Only final versions get this far, so every pattern applies and latest=auto adds latest. The retag step
          # applies these after verification; the build never pushes them.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: latest=auto
          labels: |
            org.opencontainers.image.title=DockNest
            org.opencontainers.image.licenses=AGPL-3.0-only
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64   # arm64 is not published yet; build from source on ARM hosts
          push: true
          # A non-version tag only: X.Y.Z, X.Y, X and latest are added by digest after the draft release verifies.
          tags: ${{ steps.release.outputs.image }}:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
      # cosign-release is pinned explicitly (the installer's own default today) so signing and verification use one known
      # cosign. The host updater's installer must pin this same version, and a change here changes both (F6, D14).
      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: 'v3.0.5'
      - name: Sign image by digest
        env:
          IMAGE: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Write and sign the release manifest
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node scripts/release-manifest.js --version "$VERSION" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"             --image "$IMAGE" --digest "$DIGEST" > docknest-release.json
          cosign sign-blob --yes --bundle docknest-release.json.sigstore.json docknest-release.json
      # The identity a host verifier pins (threat model section 5): this workflow, at this tag, pushed, at this commit.
      - name: Verify the image signature and the manifest bundle
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat > "$RUNNER_TEMP/verify.sh" <<'EOF'
          set -euo pipefail
          identity=(--certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" --certificate-github-workflow-trigger push
            --certificate-github-workflow-ref "$GITHUB_REF" --certificate-github-workflow-sha "$GITHUB_SHA")
          cosign verify "${identity[@]}" "$IMAGE" > /dev/null
          cosign verify-blob "${identity[@]}" --bundle "$1/docknest-release.json.sigstore.json" "$1/docknest-release.json"
          node scripts/release-manifest.js --check "$1/docknest-release.json" --version "$VERSION" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --digest "$DIGEST"
          EOF
          bash "$RUNNER_TEMP/verify.sh" .
      - name: Create the GitHub Release as a draft and verify its assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -o pipefail
          assets=(docknest-release.json docknest-release.json.sigstore.json)
          # A published release is never rewritten; a draft left by an earlier failed run gets the new assets. Any gh or
          # API error fails the step (bash -e), and so does more than one release for the tag.
          draft=$(gh release list --limit 1000 --json tagName,isDraft --jq '[.[] | select(.tagName == $ENV.GITHUB_REF_NAME)] | if length == 0 then "none" elif length == 1 then (.[0].isDraft | tostring) else error("more than one release for the tag") end')
          case "$draft" in
            false) echo "::error::$GITHUB_REF_NAME is already published; its signed assets are not replaced"; exit 1 ;;
            true)
              # Only the two signed files may stay on a reused draft.
              gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | while IFS= read -r name; do
                case "$name" in docknest-release.json|docknest-release.json.sigstore.json) ;; *) gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes ;; esac
              done
              gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber ;;
            none)
              notes=$(node -p "require('./docknest-release.json').notes || ''")
              set -- "$GITHUB_REF_NAME" "${assets[@]}" --draft --title "DockNest $VERSION" --verify-tag
              # The notes front matter is data for the manifest, not text for the release page.
              if [ -n "$notes" ]; then node scripts/release-manifest.js --notes-body "$notes" > "$RUNNER_TEMP/notes.md"; set -- "$@" --notes-file "$RUNNER_TEMP/notes.md"; else set -- "$@" --generate-notes; fi
              gh release create "$@" ;;
            *) echo "::error::unexpected release state $draft"; exit 1 ;;
          esac
          names=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name] | sort | join(" ")')
          [ "$names" = "docknest-release.json docknest-release.json.sigstore.json" ] || { echo "::error::the draft carries $names"; exit 1; }
          # Verify what was uploaded, not only the local files, before anyone can see the release.
          rm -rf "$RUNNER_TEMP/published" && mkdir "$RUNNER_TEMP/published"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/published" --pattern docknest-release.json --pattern docknest-release.json.sigstore.json
          bash "$RUNNER_TEMP/verify.sh" "$RUNNER_TEMP/published"
      # Only now do the version tags move, by digest, to the image that was signed and verified (buildx is SHA-pinned
      # through setup-buildx-action). Each tag is then read back and must resolve to the signed digest.
      - name: Tag the verified image X.Y.Z, X.Y, X and latest
        env:
          SOURCE: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -o pipefail
          mapfile -t tags < <(printf '%s\n' "$TAGS" | sed '/^$/d')
          [ "${#tags[@]}" -eq 4 ] || { echo "::error::expected the X.Y.Z, X.Y, X and latest tags, got ${tags[*]}"; exit 1; }
          set --; for tag in "${tags[@]}"; do set -- "$@" --tag "$tag"; done
          docker buildx imagetools create "$@" "$SOURCE"
          for tag in "${tags[@]}"; do
            got=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            [ "$got" = "$DIGEST" ] || { echo "::error::$tag resolves to $got, not the signed $DIGEST"; exit 1; }
          done
      - name: Publish the release and compare its assets with the signed files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          rm -rf "$RUNNER_TEMP/final" && mkdir "$RUNNER_TEMP/final"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/final" --pattern docknest-release.json --pattern docknest-release.json.sigstore.json
          for asset in docknest-release.json docknest-release.json.sigstore.json; do
            [ "$(sha256sum < "$asset")" = "$(sha256sum < "$RUNNER_TEMP/final/$asset")" ] || { echo "::error::the published $asset differs from the signed file"; exit 1; }
          done
