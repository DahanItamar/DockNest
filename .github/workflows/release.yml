name: Release
# Publishes ghcr.io/<owner>/docknest for a final vX.Y.Z tag, signs it keylessly and attaches docknest-release.json with
# its keyless cosign bundle (docknest-release.json.sigstore.json). The release is created as a draft and published only
# after the image signature and the uploaded manifest bundle verify with the same pinned cosign (threat model F6).
# Image tags: X.Y.Z, X.Y, X and latest. There are no public release candidates: a tag with a pre-release suffix
# (vX.Y.Z-rc.N) fails before anything is built, so it never creates a GitHub Release or an image tag. A candidate is
# validated privately by release-validation.yml (candidate input) on its main commit before the final tag is pushed.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Fail closed: nothing is built, pushed or signed unless this read-only job proves that the tag is a final vX.Y.Z, its
  # commit is on main, the Verify workflow (privacy, check, browser, linux-integration, upgrade, gate) finished
  # successfully for exactly that commit, and the Release validation workflow, dispatched from main with that commit as
  # its candidate, succeeded. The write permissions exist only in the publish job, which needs this one.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read    # check out the tagged commit and main's history
      actions: read     # look up the Verify and Release validation runs for the tagged commit
    steps:
      - name: Refuse anything but a final vX.Y.Z tag
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ $REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::$REF_NAME is not a final vX.Y.Z tag. Release candidates are not published; validate the main commit with the Release validation workflow (candidate input) and tag vX.Y.Z instead."; exit 1; }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # all branches and tags: origin/main must be present for the ancestry checks
          persist-credentials: false
      - name: Require tag on main with a green Verify run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git rev-parse -q --verify refs/remotes/origin/main > /dev/null || { echo "::error::origin/main was not fetched"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=50" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .name == "Verify")] | length')
          [ "${passed:-0}" -ge 1 ] || { echo "::error::No successful Verify run for $GITHUB_SHA; wait for CI on main to pass before tagging"; exit 1; }
      # The run name carries the candidate SHA (run-name in release-validation.yml). Only successful runs dispatched from
      # main in this repository count, and the commit each ran from must be on main, so the workflow file that did the
      # validation is the protected one on main (a tag named "main" would also report head_branch main).
      - name: Require a successful release validation of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-validation.yml/runs?branch=main&event=workflow_dispatch&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.conclusion == \"success\" and .event == \"workflow_dispatch\" and .head_branch == \"main\" and .head_repository.full_name == \"$GITHUB_REPOSITORY\" and .display_title == \"Release validation candidate $GITHUB_SHA\") | .head_sha")
          validated=0
          for run in $runs; do git merge-base --is-ancestor "$run" origin/main 2>/dev/null && validated=1; done
          [ "$validated" = 1 ] || { echo "::error::No successful Release validation run for candidate $GITHUB_SHA; run it from main with that commit as the candidate before tagging"; exit 1; }
  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # create the GitHub Release and upload its manifest
      packages: write   # push to ghcr.io with GITHUB_TOKEN
      id-token: write   # cosign keyless signing through GitHub OIDC
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Resolve release
        id: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Fails before anything is built when the notes front matter or the updater file list is invalid.
          node scripts/release-manifest.js --version "$version" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docknest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ steps.release.outputs.image }}
          # Only final versions get this far, so every pattern applies and latest=auto adds latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: latest=auto
          labels: |
            org.opencontainers.image.title=DockNest
            org.opencontainers.image.licenses=AGPL-3.0-only
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64   # arm64 is not published yet; build from source on ARM hosts
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # cosign-release is pinned explicitly (the installer's own default today) so signing and verification use one known
      # cosign. The host updater's installer must pin this same version, and a change here changes both (F6, D14).
      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: 'v3.0.5'
      - name: Sign image by digest
        env:
          IMAGE: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Write and sign the release manifest
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node scripts/release-manifest.js --version "$VERSION" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"             --image "$IMAGE" --digest "$DIGEST" > docknest-release.json
          cosign sign-blob --yes --bundle docknest-release.json.sigstore.json docknest-release.json
      # The identity a host verifier pins (threat model section 5): this workflow, at this tag, pushed, at this commit.
      - name: Verify the image signature and the manifest bundle
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat > "$RUNNER_TEMP/verify.sh" <<'EOF'
          set -euo pipefail
          identity=(--certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" --certificate-github-workflow-trigger push
            --certificate-github-workflow-ref "$GITHUB_REF" --certificate-github-workflow-sha "$GITHUB_SHA")
          cosign verify "${identity[@]}" "$IMAGE" > /dev/null
          cosign verify-blob "${identity[@]}" --bundle "$1/docknest-release.json.sigstore.json" "$1/docknest-release.json"
          node scripts/release-manifest.js --check "$1/docknest-release.json" --version "$VERSION" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --digest "$DIGEST"
          EOF
          bash "$RUNNER_TEMP/verify.sh" .
      - name: Create the GitHub Release as a draft, verify its assets, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          assets=(docknest-release.json docknest-release.json.sigstore.json)
          # A published release is never rewritten; a draft left by an earlier failed run gets the new assets.
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2> /dev/null || echo none)
          if [ "$draft" = false ]; then echo "::error::$GITHUB_REF_NAME is already published; its signed assets are not replaced"; exit 1; fi
          if [ "$draft" = true ]; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            notes=$(node -p "require('./docknest-release.json').notes || ''")
            set -- "$GITHUB_REF_NAME" "${assets[@]}" --draft --title "DockNest $VERSION" --verify-tag
            # The notes front matter is data for the manifest, not text for the release page.
            if [ -n "$notes" ]; then node scripts/release-manifest.js --notes-body "$notes" > "$RUNNER_TEMP/notes.md"; set -- "$@" --notes-file "$RUNNER_TEMP/notes.md"; else set -- "$@" --generate-notes; fi
            gh release create "$@"
          fi
          # Verify what was uploaded, not only the local files, before anyone can see the release.
          rm -rf "$RUNNER_TEMP/published" && mkdir "$RUNNER_TEMP/published"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/published" --pattern docknest-release.json --pattern docknest-release.json.sigstore.json
          bash "$RUNNER_TEMP/verify.sh" "$RUNNER_TEMP/published"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
