name: Bug report
description: Something in DockNest doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Use mock data only: never paste real credentials, server addresses, backups or customer data.
        For security problems, use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect a server ...
        2. Run a backup of ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DockNest version or commit
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version, manager OS, remote host OS, Docker version.
      placeholder: "Node.js 24.1, Ubuntu 24.04 manager, Debian 12 host, Docker 28"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant job details or logs
      description: Remove hostnames, IPs, usernames and paths first.
      render: text
