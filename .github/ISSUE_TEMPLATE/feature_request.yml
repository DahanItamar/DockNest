name: Feature request
description: Suggest an improvement to DockNest.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation first, before any solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like DockNest to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
