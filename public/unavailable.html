<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="10">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>DockNest is restarting</title>
<style>
/* Self-contained: no scripts, no external requests. Serve it for 502/503/504 from the reverse proxy (docs/deployment.md). */
:root{--bg:#EEF2F6;--surface:#FFFFFF;--heading:#121926;--text:#4B5565;--border:#E3E8EF;--button:#5E35B1;--button-hover:#4527A0;--on-button:#FFFFFF;--focus:#673AB7;--secondary-hover:#EEF2F6;--border-control:#7D8998;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#101724;--surface:#182131;--heading:#F2F6FE;--text:#B5C1D3;--border:#304057;--button:#8457D9;--button-hover:#7446C6;--on-button:#FFFFFF;--focus:#C0A4FA;--secondary-hover:#253247;--border-control:#70839B;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-width:320px;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--text);font:400 16px/24px Roboto,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
main{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:560px;animation:enter .24s cubic-bezier(.2,0,0,1) both}
.code{margin:0;font-size:clamp(104px,min(30vw,36vh),224px);line-height:1;font-weight:900;letter-spacing:-.045em;margin-bottom:-.22em;color:var(--heading);background:linear-gradient(to bottom,var(--heading) 20%,transparent 76%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;user-select:none}
h1{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
p.text{margin:4px 0 0;max-width:44ch;font-size:16px;line-height:24px;text-wrap:balance}
.actions{display:flex;justify-content:center;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:152px;height:40px;padding:0 16px;border:1px solid var(--button);border-radius:8px;background:var(--button);color:var(--on-button);font-size:14px;line-height:20px;font-weight:500;text-decoration:none;white-space:nowrap;transition:background-color .16s cubic-bezier(.2,0,0,1)}
.btn:hover{background:var(--button-hover);border-color:var(--button-hover)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.btn svg{flex:none}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(max-width:480px){.actions{width:100%}.btn{width:100%;height:44px}}
@media(prefers-reduced-motion:reduce){main{animation:none}.btn{transition:none}}
@media(forced-colors:active){.code{background:none;-webkit-text-fill-color:currentColor;color:CanvasText}}
</style>
</head>
<body>
<main>
<p class="code" aria-hidden="true">503</p>
<h1>DockNest is unavailable</h1>
<p class="text" role="status">DockNest is restarting. This page retries automatically.</p>
<div class="actions"><a class="btn" href=""><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2m-.5-4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>Retry</a></div>
</main>
</body>
</html>
