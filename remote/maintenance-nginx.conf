# Reviewed integration template; replace paths/upstream/domain and configure TLS separately.
# Never put this proxy inside the site's container group.
server {
  listen 80;
  server_name example.invalid;
  root /var/lib/docker-backup-manager/maintenance/SITE_ID;
  error_page 503 /maintenance.html;
  location = /maintenance.html { internal; add_header Retry-After 30 always; add_header Cache-Control no-store always; }
  location = /__backup_status {
    default_type application/json;
    add_header Cache-Control no-store always;
    if (-f /var/lib/docker-backup-manager/maintenance/SITE_ID/enabled) { return 503 '{"maintenance":true}'; }
    return 200 '{"maintenance":false}';
  }
  location / {
    if (-f /var/lib/docker-backup-manager/maintenance/SITE_ID/enabled) { return 503; }
    proxy_pass http://127.0.0.1:8080;
  }
}
# After nginx -t, reload, and successful public probes, administrator creates 'ready'.
# API routes need a separate JSON 503 location according to application routing.
