# Include in Nginx's http context. Review domain/upstream/paths and TLS first.
# Keep the proxy outside the site's backup container group.
map $request_method $docknest_safe_method { default 0; GET 1; HEAD 1; }
map "$docknest_safe_method:$docknest_maintenance" $docknest_reject_action { default 0; "0:1" 1; }
server {
  listen 80;
  server_name example.invalid;
  root /var/lib/docknest/maintenance/SITE_ID;
  set $docknest_maintenance 0;
  if (-f /var/lib/docknest/maintenance/SITE_ID/enabled) { set $docknest_maintenance 1; }
  # 418 is internal only: actions/APIs receive JSON 503 with no reload script.
  error_page 418 =503 @maintenance_api;
  location @maintenance_api {
    default_type application/json;
    add_header Retry-After 30 always;
    add_header Cache-Control no-store always;
    return 503 '{"maintenance":true,"error":"Site temporarily under maintenance"}';
  }
  error_page 503 /maintenance.html;
  location = /maintenance.html { internal; add_header Retry-After 30 always; add_header Cache-Control no-store always; }
  location = /__backup_status {
    default_type application/json;
    add_header Cache-Control no-store always;
    if ($docknest_maintenance) { return 418; }
    return 200 '{"maintenance":false}';
  }
  location /api/ {
    if ($docknest_maintenance) { return 418; }
    proxy_pass http://127.0.0.1:8080;
  }
  location / {
    if ($docknest_reject_action) { return 418; }
    if ($docknest_maintenance) { return 503; }
    proxy_pass http://127.0.0.1:8080;
  }
}
# After nginx -t, reload, and successful public probes, administrator creates 'ready'.
# Review API prefixes according to application routing.
