# Host nginx: a proxied app with a certbot certificate, a pool, and a static site. Made-up names only.
upstream shop_pool {
    server 127.0.0.1:8081 weight=5;
}
server {
    listen 80;
    listen [::]:443 ssl;
    server_name shop.example.com www.shop.example.com;
    ssl_certificate /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
    auth_basic_user_file /etc/nginx/fixture-secret-htpasswd;
    location / {
        proxy_set_header X-Api-Key "fixture-secret-do-not-leak";
        proxy_pass http://fixture:fixture-secret-do-not-leak@127.0.0.1:8080/app?token=fixture-secret-do-not-leak;
    }
}
server {
    listen 127.0.0.1:8443 ssl;
    server_name pool.example.com;
    ssl_certificate /etc/ssl/custom-chain.pem;
    location / { proxy_pass http://shop_pool; }
}
server {
    server_name blog.example.net;
    location / { proxy_pass http://blog-web:2368; }
}
server {
    server_name dynamic.example.net;
    location / { proxy_pass http://$backend_from_map; }
}
